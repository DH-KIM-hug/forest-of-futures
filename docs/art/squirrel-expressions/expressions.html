<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="claude:viewport-fit-sides" content="cover">
<title>선물의 숲 주인공 표정 5종</title>
<style>
:root {
  --bg: #FBF6EC;
  --fg: #3B2F25;
  --muted: #7A6A5C;
  --card: #FFFFFF;
  --accent: #C0703A;
  --line: #E7DCCB;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #201A15; --fg: #F3E9DA; --muted: #B8A894; --card: #2C241D; --accent: #E09A62; --line: #443728;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #201A15; --fg: #F3E9DA; --muted: #B8A894; --card: #2C241D; --accent: #E09A62; --line: #443728;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 14px/1.6 -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: 24px;
  padding-bottom: 40px;
}
main { max-width: 980px; margin: 0 auto; }
h1 { font-size: 22px; margin: 0 0 4px; }
.lead { color: var(--muted); margin: 0 0 20px; }
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
  gap: 14px;
}
figure {
  margin: 0;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 10px;
}
figure img { display: block; width: 100%; height: auto; border-radius: 8px; }
figcaption { margin-top: 8px; }
.tag { font-weight: 700; color: var(--accent); margin-right: 6px; }
.desc { color: var(--muted); font-size: 13px; }
.note {
  margin-top: 22px;
  padding: 14px 16px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--card);
  color: var(--muted);
  font-size: 13px;
}
</style>
</head>
<body>
<main>
  <h1>주인공 다람쥐 표정 5종 (v1)</h1>
  <p class="lead">스타일 D(파스텔 소프트 셀)로 뽑은 표정입니다. 기준 그림과 같은 캐릭터로 맞췄습니다.</p>

  <div class="grid">
    <figure>
      <img src="01_calm.png" alt="01 평온">
      <figcaption><span class="tag">01</span>평온<div class="desc">기본 상태</div></figcaption>
    </figure>
    <figure>
      <img src="02_joy.png" alt="02 환희">
      <figcaption><span class="tag">02</span>환희<div class="desc">황금 도토리를 든 수익 연출</div></figcaption>
    </figure>
    <figure>
      <img src="03_panic.png" alt="03 식은땀">
      <figcaption><span class="tag">03</span>식은땀<div class="desc">패닉, 이자 독촉</div></figcaption>
    </figure>
    <figure>
      <img src="04_crying.png" alt="04 오열">
      <figcaption><span class="tag">04</span>오열<div class="desc">파산 직전·파산</div></figcaption>
    </figure>
    <figure>
      <img src="05_dazed.png" alt="05 멍함">
      <figcaption><span class="tag">05</span>멍함<div class="desc">고배율 중독, 정신 이탈</div></figcaption>
    </figure>
  </div>

  <div class="note">
    확인할 점: 기준 그림과 크기·비율이 맞는지, 얼굴이 5종에서 같은 캐릭터로 읽히는지, 셀 그림자가 과하지 않은지.
    맞으면 이 표정 5종을 기준으로 고정하고, 금융 NPC 4명과 배경 생성으로 넘어갑니다.
  </div>
</main>
</body>
</html>
