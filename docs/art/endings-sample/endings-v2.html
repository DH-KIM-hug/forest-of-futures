<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="claude:viewport-fit-sides" content="cover">
<title>파산 엔딩 귀여운 캐릭터 잔혹한 상황 샘플</title>
<style>
:root {
  --bg: #FBF6EC;
  --fg: #3B2F25;
  --muted: #7A6A5C;
  --card: #FFFFFF;
  --accent: #C0703A;
  --line: #E7DCCB;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #201A15; --fg: #F3E9DA; --muted: #B8A894; --card: #2C241D; --accent: #E09A62; --line: #443728;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #201A15; --fg: #F3E9DA; --muted: #B8A894; --card: #2C241D; --accent: #E09A62; --line: #443728;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 14px/1.6 -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: 24px;
  padding-bottom: 40px;
}
main { max-width: 980px; margin: 0 auto; }
h1 { font-size: 22px; margin: 0 0 4px; }
.lead { color: var(--muted); margin: 0 0 20px; }
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 14px;
}
figure {
  margin: 0;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 10px;
}
figure img { display: block; width: 100%; height: auto; border-radius: 8px; }
figcaption { margin-top: 8px; }
.tag { font-weight: 700; color: var(--accent); margin-right: 6px; }
.desc { color: var(--muted); font-size: 13px; }
.quote { margin-top: 6px; font-size: 13px; color: var(--fg); }
.note {
  margin-top: 22px;
  padding: 14px 16px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--card);
  color: var(--muted);
  font-size: 13px;
}
</style>
</head>
<body>
<main>
  <h1>귀여운 캐릭터, 잔혹한 결과</h1>
  <p class="lead">캐릭터는 귀엽게 두고, 파산의 결과는 실제처럼 잔인하게 보여 줍니다. 피나 신체 훼손 같은 그래픽 묘사는 하지 않고, 압류·추심·망신·노숙 같은 현실의 결과로 무게를 만듭니다.</p>

  <div class="grid">
    <figure>
      <img src="v2_E002_seized.png" alt="END-002 집 압류">
      <figcaption><span class="tag">END-002</span>황금 저택의 흑자 도산
        <div class="desc">압류 고지문이 붙은 대문 앞, 짐 한 봉지</div>
        <div class="quote">"3억 원짜리 집에서 200만 원을 못 내 경매로 쫓겨났습니다."</div></figcaption>
    </figure>
    <figure>
      <img src="v2_E042_exposed.png" alt="END-042 연락처 유출">
      <figcaption><span class="tag">END-042</span>지인 연락처 유출
        <div class="desc">어두운 방, 적의에 찬 메시지가 쏟아지는 휴대폰</div>
        <div class="quote">"온 숲속 단톡방에 내 채무가 생중계되었습니다."</div></figcaption>
    </figure>
    <figure>
      <img src="v2_E045_callcentre.png" alt="END-045 콜센터 강제 노역">
      <figcaption><span class="tag">END-045</span>숲속 콜센터 강제 노역
        <div class="desc">차가운 조명 아래 헤드셋, 끝없이 쌓인 서류</div>
        <div class="quote">"헤드셋을 끼고 밤새 전화기를 듭니다."</div></figcaption>
    </figure>
    <figure>
      <img src="v2_E180_street.png" alt="END-180 길바닥">
      <figcaption><span class="tag">END-180</span>길바닥 도토리 줍기의 한계
        <div class="desc">비 오는 거리, 빈 지갑과 종이 팻말</div>
        <div class="quote">"사채 이자를 따라잡을 수 없었습니다."</div></figcaption>
    </figure>
  </div>

  <div class="note">
    확인할 점: 잔인함이 실제처럼 읽히는지, 그래픽 수위가 과하지 않은지, 캐릭터가 귀여움을 유지하는지.
    괜찮으면 이 규칙(귀여운 캐릭터 + 차가운 배경 + 현실의 결과)을 엔딩 일러스트 기준으로 고정하고 대표 엔딩 10장을 뽑겠습니다.
  </div>
</main>
</body>
</html>
