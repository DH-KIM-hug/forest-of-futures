<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="claude:viewport-fit-sides" content="cover">
<title>파산 엔딩 가벼운 블랙코미디 샘플</title>
<style>
:root {
  --bg: #FBF6EC;
  --fg: #3B2F25;
  --muted: #7A6A5C;
  --card: #FFFFFF;
  --accent: #C0703A;
  --line: #E7DCCB;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #201A15; --fg: #F3E9DA; --muted: #B8A894; --card: #2C241D; --accent: #E09A62; --line: #443728;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #201A15; --fg: #F3E9DA; --muted: #B8A894; --card: #2C241D; --accent: #E09A62; --line: #443728;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 14px/1.6 -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: 24px;
  padding-bottom: 40px;
}
main { max-width: 980px; margin: 0 auto; }
h1 { font-size: 22px; margin: 0 0 4px; }
.lead { color: var(--muted); margin: 0 0 20px; }
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 14px;
}
figure {
  margin: 0;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 10px;
}
figure img { display: block; width: 100%; height: auto; border-radius: 8px; }
figcaption { margin-top: 8px; }
.tag { font-weight: 700; color: var(--accent); margin-right: 6px; }
.desc { color: var(--muted); font-size: 13px; }
.quote {
  margin-top: 6px;
  font-size: 13px;
  color: var(--fg);
}
.note {
  margin-top: 22px;
  padding: 14px 16px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--card);
  color: var(--muted);
  font-size: 13px;
}
</style>
</head>
<body>
<main>
  <h1>파산 엔딩 가벼운 블랙코미디 샘플</h1>
  <p class="lead">현실은 원래 이렇게 가볍게 굴러간다는 방향입니다. 무거운 장면을 무겁게 그리지 않고, 웃기게 보이는 연출로 풍자합니다. 기준 캐릭터는 P1 변형입니다.</p>

  <div class="grid">
    <figure>
      <img src="E002_golden-gate.png" alt="END-002 황금 저택 압류">
      <figcaption><span class="tag">END-002</span>황금 저택의 흑자 도산
        <div class="desc">대문에 압류 딱지, 머쓱하게 가방 하나 든 주인공</div>
        <div class="quote">"3억 원짜리 집에서 200만 원을 못 내 쫓겨났습니다. 최고의 카푸어!"</div></figcaption>
    </figure>
    <figure>
      <img src="E151_candle-hammer.png" alt="END-151 벼락 청산">
      <figcaption><span class="tag">END-151</span>50배 풀레버리지 벼락 청산
        <div class="desc">장대 음봉이 망치처럼 떨어짐, 과장된 놀란 얼굴</div>
        <div class="quote">"버튼을 누르자마자 빛보다 빠른 청산!"</div></figcaption>
    </figure>
    <figure>
      <img src="E042_phone-flood.png" alt="END-042 연락처 유출">
      <figcaption><span class="tag">END-042</span>지인 연락처 유출
        <div class="desc">알림이 쏟아지는 휴대폰, 웃고 있는 독사 대부</div>
        <div class="quote">"온 숲속 단톡방에 내 채무가 생중계됩니다."</div></figcaption>
    </figure>
    <figure>
      <img src="E200_crown-sacks.png" alt="END-200 전설의 아귀">
      <figcaption><span class="tag">END-200</span>전설의 숲속 아귀
        <div class="desc">빈 도토리 자루 위에 종이 왕관, 우쭐한 자세</div>
        <div class="quote">"당신은 파산의 대가입니다. 숲의 모든 동물이 찬사를 보냅니다."</div></figcaption>
    </figure>
  </div>

  <div class="note">
    확인할 점: 웃기게 읽히는지, 피해자를 놀리는 것처럼 보이지는 않는지, 엔딩마다 같은 틀로 반복되지 않는지.
    괜찮으면 이 톤을 엔딩 일러스트 규칙으로 고정하고, 대표 엔딩 10장을 같은 틀로 뽑겠습니다.
  </div>
</main>
</body>
</html>
